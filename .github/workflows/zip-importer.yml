name: Unzip Files
on: [push]
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract files
        run: |
          unzip exercises.zip -d ./
          rm exercises.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Unzipped 2600+ files automatically"
          git push
